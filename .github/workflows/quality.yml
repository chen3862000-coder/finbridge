name: Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run blocking quality gates
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Console
        working-directory: frontend
        run: npm run build

      - name: Run Console unit tests
        working-directory: frontend
        run: npm test

      - name: Run accessibility and viewport checks
        working-directory: frontend
        run: npm run test:a11y

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Generate local TLS fixtures
        run: ./deploy/generate-local-tls.sh

      - name: Start clean Compose stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Record source identity, service health, and synthetic seed counts
        run: |
          printf 'Commit: %s\n' "$(git rev-parse HEAD)"
          docker compose ps
          docker compose exec -T postgres psql -U finbridge -d finbridge -Atc "SELECT 'tenants=' || count(*) FROM tenants UNION ALL SELECT 'memberships=' || count(*) FROM demo_identity_memberships UNION ALL SELECT 'products=' || count(*) FROM loan_products UNION ALL SELECT 'active_plugins=' || count(*) FROM plugin_artifacts WHERE desired_state = 'ACTIVE' UNION ALL SELECT 'bindings=' || count(*) FROM tenant_plugin_bindings;"
          curl --fail --insecure --silent --show-error --output /dev/null --write-out 'Borrower route HTTP %{http_code}\n' https://localhost:8443/borrower

      - name: Run authenticated HTTP E2E
        env:
          FINBRIDGE_DEMO_ALLOW_INSECURE_TLS: 'true'
        run: npm --prefix frontend run test:e2e

      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose and discard CI-only volumes
        if: always()
        run: docker compose down -v
