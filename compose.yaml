name: finbridge-local

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: finbridge
      POSTGRES_USER: finbridge
      POSTGRES_PASSWORD: ${FINBRIDGE_DB_PASSWORD:-finbridge-local-only}
    ports:
      - "127.0.0.1:${FINBRIDGE_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbridge -d finbridge"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  console:
    image: node:24.13.1-alpine
    working_dir: /workspace/frontend
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://demo-api:8080
    volumes:
      - ./frontend:/workspace/frontend:ro
      - frontend-node-modules:/workspace/frontend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth", "--hostname=https://localhost:8443/auth"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-demo-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-demo-admin-local-only}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/finbridge-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /auth/realms/finbridge/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  demo-api:
    build:
      context: .
      dockerfile: finbridge-demo-app/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finbridge
      SPRING_DATASOURCE_USERNAME: finbridge
      SPRING_DATASOURCE_PASSWORD: ${FINBRIDGE_DB_PASSWORD:-finbridge-local-only}
      FINBRIDGE_OIDC_ISSUER: https://localhost:8443/auth/realms/finbridge
      FINBRIDGE_OIDC_AUTHORIZATION_URI: https://localhost:8443/auth/realms/finbridge/protocol/openid-connect/auth
      FINBRIDGE_OIDC_TOKEN_URI: http://keycloak:8080/auth/realms/finbridge/protocol/openid-connect/token
      FINBRIDGE_OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/finbridge/protocol/openid-connect/certs
      FINBRIDGE_OIDC_USERINFO_URI: http://keycloak:8080/auth/realms/finbridge/protocol/openid-connect/userinfo
      FINBRIDGE_PLUGIN_DIRECTORY: /app/plugins
      FINBRIDGE_DEMO_BOOTSTRAP_PLUGINS: "true"
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/run/tls/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12
    volumes:
      - ./deploy/tls/truststore.p12:/run/tls/truststore.p12:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
    extra_hosts:
      - "localhost:host-gateway"
    restart: unless-stopped

  https-proxy:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      demo-api:
        condition: service_healthy
      console:
        condition: service_started
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres-data:
  frontend-node-modules:
