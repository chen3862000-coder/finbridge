server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /actuator/health {
        proxy_pass http://demo-api:8080/actuator/health;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8443;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location = /actuator/health/readiness {
        proxy_pass http://demo-api:8080/actuator/health/readiness;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8443;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8443;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location /api/ {
        proxy_pass http://demo-api:8080;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8443;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location /login/oauth2/code/ {
        proxy_pass http://demo-api:8080/login/oauth2/code/;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8443;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location /oauth2/ {
        proxy_pass http://demo-api:8080/oauth2/;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8443;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location /login/ {
        proxy_pass http://demo-api:8080/login/;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8443;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location /logout {
        proxy_pass http://demo-api:8080/logout;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:8443;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location /actuator/ {
        proxy_pass http://demo-api:8080/actuator/;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://console:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host:8443;
    }
}
